# GitLab CE (latest, all-in-one: postgres + redis included) in namespace "gitlab"
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate            # never run 2 GitLab pods on the same volume
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          ports:
            - containerPort: 80
          env:
            - name: GITLAB_ROOT_PASSWORD
              value: "Oel-Moue@2026!"
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab.gitlab.svc'
                # --- lighter GitLab ---
                puma['worker_processes'] = 0
                sidekiq['concurrency'] = 5
                prometheus_monitoring['enable'] = false
                gitlab_rails['usage_ping_enabled'] = false
                gitlab_kas['enable'] = false
                registry['enable'] = false
                gitlab_pages['enable'] = false
                mattermost['enable'] = false
          resources:
            requests:
              cpu: "500m"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 5Gi
          readinessProbe:
            httpGet:
              path: /users/sign_in
              port: 80
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 80
          volumeMounts:
            - { name: data, mountPath: /etc/gitlab,     subPath: config }
            - { name: data, mountPath: /var/opt/gitlab, subPath: data }
            - { name: data, mountPath: /var/log/gitlab, subPath: logs }
            - { name: shm,  mountPath: /dev/shm }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - port: 80
      targetPort: 80